projects:
  globFormat: "source-path"
  globs:
    - "packages/*/*"
    - "apps/*/moon.yml"
    - "moon.yml"
    - "electron/moon.yml"
    - "packages/runtime-core/moon.yml"
    - "packages/runtime-adapters/moon.yml"
    - "packages/plugin-platform/moon.yml"
  sources:
    "openbuddy": "."
    "openbuddy-website": "apps/openbuddy-website"

vcs:
  defaultBranch: "main"
  provider: "github"
